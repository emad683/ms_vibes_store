<svg xmlns="http://www.w3.org/2000/svg" width="48" height="36" viewBox="0 0 48 36">
  <defs>
    <radialGradient id="holeDepth" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#14100c"/>
      <stop offset="65%" stop-color="#231c16"/>
      <stop offset="90%" stop-color="#3b3127"/>
      <stop offset="100%" stop-color="#4d4135"/>
    </radialGradient>
    <linearGradient id="holeHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.85)"/>
    </linearGradient>
  </defs>
  <!-- Emboss / Paper thickness rim -->
  <circle cx="20" cy="18" r="6.5" fill="none" stroke="url(#holeHighlight)" stroke-width="1"/>
  <!-- Cutout hole -->
  <circle cx="20" cy="18" r="6" fill="url(#holeDepth)"/>
</svg>
